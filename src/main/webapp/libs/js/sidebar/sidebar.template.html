<div class="sidebar">
    <div class="container" style="padding-left:0px; padding-right:0px;">
        <div class="title-bar row" style="margin-right:0px" ng-click="$ctrl.toggle()">
            <div class="menu-toggle col-xs-1" >
                <button class="btn btn-link btn-borderless">
                    <span class="menu-toggle-icon title-bar-item glyphicon glyphicon-menu-down white-icon" 
                        ng-class="{'upsidedown' : $ctrl.titleBarExpanded}"></span>
                </button>
            </div>

            <div class="title-bar-item title-bar-text fade-element text-start col-xs-11" 
                 ng-if="$ctrl.titleBarExpanded == false"> {{$ctrl.title}} </div>
        </div>
    </div>

    <div class="sidebar-content">
        <div class="sidebar-element sidebar-title fade-element" ng-if="$ctrl.titleBarExpanded || $ctrl.titleBarHidden">
            <a href="/" ng-click="$ctrl.toggle()">
                <h1 class="sidebar-link">{{$ctrl.title}}</h1></a>
        </div>

        <div class="sidebar-element sidebar-menu">
            <ul>
                <li ng-repeat="link in $ctrl.links"> 
                    <a href="{{link.url}}" ng-attr-target="{{link.external ? '_blank' : undefined}}" ng-click="$ctrl.toggle()">
                        <h4 class="sidebar-link"> 
                            <span class="glyphicon white-icon" ng-class="link.icon" style="font-size:1.1rem; margin-right:1rem;"></span>
                            {{link.name}}</h4></a>
                    </li>
            </ul>
        </div>

    </div>
</div>
