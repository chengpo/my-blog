<div class="content-body">
    <loading-progress in-progress="$ctrl.inProgress"></loading-progress>

    <div class="container-fluid" ng-if="$ctrl.posts">
        <div class="post-list-item" ng-repeat="post in $ctrl.posts | filter : $ctrl.tagFilter | limitTo : $ctrl.page_size : $ctrl.offset">
            <div class="row post-title">
                <div class="col-md-10 col-md-offset-1"><h1>{{post.metadata.title}}</h1></div>
            </div>

            <div class="row post-attr">
                <div class="col-md-3 col-md-offset-1 text-muted small">{{post.metadata.crtime}}</div>
                <div class="col-md-3 text-muted small">
                    <a class="text-muted" href="" ng-click="$ctrl.selectTag(post.metadata.tag); $event.preventDefault();">{{post.metadata.tag}}</a>
                </div> 
            </div>

            <div class="row">
                <div class="col-md-10 col-md-offset-1" ng-bind-html="post.content | trustAsHtml"></div>
            </div>

            <!-- hide 'read more ...' for fully loaded post -->
            <div ng-hide="post.content.endsWith('<!--eof-->\n')" class="row">
                <div class="col-md-4 col-md-offset-1">
                    <a href="#!/{{post.metadata.url}}">
                      <p class="text-left">Read More ...</p></a>
                </div>
            </div>

            <hr ng-hide="$last">
        </div>

        <error-msg error-data="$ctrl.error"></error-msg>

        <!-- show backward / forward button if needed-->
        <div class="row">
            <div class="col-md-10 col-md-offset-1">
                <button type="button" class="btn btn-default bt-lg pull-left" ng-disabled="$ctrl.disable_forward" ng-click="$ctrl.forward()">
                    <span class="glyphicon glyphicon-step-backward" aria-hidden="true"></span>
                    Newer Post
                </button>

                <button type="button" class="btn btn-default bt-lg pull-right" ng-disabled="$ctrl.disable_backward" ng-click="$ctrl.backward()">
                    Older Post
                    <span class="glyphicon glyphicon-step-forward" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
</div>
