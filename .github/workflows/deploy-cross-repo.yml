name: Publish Static Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo my-blog (Source Code)
        uses: actions/checkout@v5
        with:
           lfs: true

      - name: Install build tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # 1. Setup Java 27 Runtime Environment
      - name: Setup Java 27
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' # Uses Eclipse Temurin OpenJDK
          java-version: '27'
          cache: 'maven'        # Change to 'gradle' if using Gradle

      # 2. Run your Java build command (
      - name: Build with Maven
        run: make static
        
      # 3. Push the generated build folder to your User Page repo
      - name: Deploy to  mExternal User Page Repo
        uses: Peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: chengpo/chengpo.github.io
          publish_branch: master
          publish_dir: ./static-dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
